[project]
name = "composio-shiprocket"
version = "0.1.0"
description = "Shiprocket toolkit for Composio agents, with token refresh, rate-limit-aware retries and agent-readable errors"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "pydantic>=2.6"]

[project.optional-dependencies]
composio = ["composio>=0.10"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/composio_shiprocket"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
